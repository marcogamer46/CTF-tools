<title>CTF Toolbelt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a left rail (search, filters, category list) beside one column of category sections made of tool cards. Stacks to a single column on phones. */
:root {
  --bg: #EDF0F4;
  --surface: #F8FAFC;
  --ink: #131A24;
  --muted: #566275;
  --line: #D3DAE3;
  --accent: #2450E6;
  --accent-soft: #DCE5FF;
  --star: #B7791F;
  --f-display: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E131B;
    --surface: #151C27;
    --ink: #E6EBF2;
    --muted: #93A0B3;
    --line: #263142;
    --accent: #7D9BFF;
    --accent-soft: #1C2A4F;
    --star: #F2B84B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E131B;
  --surface: #151C27;
  --ink: #E6EBF2;
  --muted: #93A0B3;
  --line: #263142;
  --accent: #7D9BFF;
  --accent-soft: #1C2A4F;
  --star: #F2B84B;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
  padding-block: 32px 72px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap { max-width: 1180px; margin: 0 auto; }

.top { display: flex; flex-direction: column; gap: 12px; padding-bottom: 28px; }
.eyebrow { font-family: var(--f-mono); font-size: 13px; letter-spacing: 0.04em; color: var(--accent); margin: 0; }
h1 {
  font-family: var(--f-display);
  font-weight: 700;
  font-size: clamp(2.25rem, 6vw, 3.75rem);
  line-height: 1.02;
  letter-spacing: -0.02em;
  margin: 0;
  text-wrap: balance;
}
.lede { max-width: 62ch; margin: 0; color: var(--muted); font-size: 1.0625rem; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 4px 0 0; font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); }
.stats b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
@media (min-width: 900px) {
  .layout { grid-template-columns: 264px minmax(0, 1fr); gap: 40px; align-items: start; }
  .rail { position: sticky; top: calc(20px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 40px); overflow-y: auto; }
}

.rail { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.field { position: relative; }
.field input {
  width: 100%;
  font: inherit;
  font-size: 15px;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 11px 40px 11px 14px;
}
.field input::placeholder { color: var(--muted); }
.field input:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.field kbd {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  font-family: var(--f-mono); font-size: 12px; color: var(--muted);
  border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; line-height: 20px;
  pointer-events: none;
}
@media (hover: none) { .field kbd { display: none; } }

.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 3px; gap: 3px; }
.seg button { font-size: 13.5px; font-weight: 500; color: var(--muted); padding: 7px 4px; border-radius: 6px; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.seg button:hover:not([aria-pressed="true"]) { color: var(--ink); }

.toggle { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 500; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.toggle .n { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.toggle[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.toggle[aria-pressed="true"] .n { color: var(--accent); }

.cats { display: flex; flex-wrap: wrap; gap: 6px; }
.cat { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 13.5px; font-weight: 500; }
.cat .n { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cat[aria-pressed="true"] { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.cat[aria-pressed="true"] .n { color: var(--accent); }
.cat:hover:not([aria-pressed="true"]) { border-color: var(--muted); }
@media (min-width: 900px) {
  .cats { flex-direction: column; flex-wrap: nowrap; gap: 2px; }
  .cat { border-radius: 8px; border-color: transparent; background: transparent; justify-content: space-between; padding: 8px 12px; }
  .cat:hover:not([aria-pressed="true"]) { background: var(--surface); border-color: transparent; }
}

.pick-btn { font-size: 14px; font-weight: 600; padding: 10px 14px; border-radius: 8px; background: var(--accent); color: var(--bg); text-align: center; }
.pick-btn:hover { filter: brightness(1.08); }
.note { margin: 0; font-size: 12.5px; color: var(--muted); }

main { min-width: 0; }
.summary { margin: 0 0 20px; font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); }
.results { display: flex; flex-direction: column; gap: 40px; }
.sec-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-bottom: 14px; }
.sec-head h2 { font-family: var(--f-display); font-weight: 600; font-size: 1.5rem; letter-spacing: -0.01em; margin: 0; }
.sec-head .count { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sec-head p { flex-basis: 100%; margin: 0; color: var(--muted); font-size: 14.5px; max-width: 62ch; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.card { display: flex; flex-direction: column; gap: 8px; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 14px 12px; }
.card:hover { border-color: var(--accent); }
.card.picked { outline: 2px solid var(--accent); outline-offset: 3px; }
.row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.name { font-family: var(--f-display); font-weight: 600; font-size: 1.0625rem; line-height: 1.25; text-decoration: none; overflow-wrap: anywhere; }
.name::after { content: " \2197"; font-family: var(--f-mono); font-size: 0.8em; color: var(--muted); }
.name:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.desc { margin: 0; font-size: 14px; color: var(--muted); flex: 1; }
.badge { align-self: flex-start; font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; }
.badge.web { background: var(--accent-soft); color: var(--accent); }
.badge.local { border: 1px solid var(--line); color: var(--muted); }
.star { flex: none; width: 30px; height: 30px; margin: -4px -4px 0 0; display: grid; place-items: center; color: var(--muted); border-radius: 6px; }
.star svg { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linejoin: round; }
.star:hover { color: var(--ink); }
.star[aria-pressed="true"] { color: var(--star); }
.star[aria-pressed="true"] svg { fill: currentColor; }

.empty { border: 1px dashed var(--line); border-radius: 8px; padding: 32px 20px; text-align: center; color: var(--muted); }
.empty p { margin: 0 0 12px; }
.empty button { color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

@media (prefers-reduced-motion: no-preference) {
  .card { transition: border-color 0.15s; }
}
</style>

<div class="wrap">
  <header class="top">
    <p class="eyebrow">flag{toolbelt}</p>
    <h1>CTF Toolbelt</h1>
    <p class="lede">A searchable shelf of the tools worth knowing for jeopardy-style CTFs. Browser tools need no setup. Local tools are the ones to install before the next event.</p>
    <p class="stats" id="stats"></p>
  </header>

  <div class="layout">
    <aside class="rail">
      <div class="field">
        <label class="sr" for="q">Search tools</label>
        <input id="q" type="search" placeholder="Search: rsa, stego, burp" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
      </div>
      <div class="seg" role="group" aria-label="Where the tool runs">
        <button type="button" data-kind="all" aria-pressed="true">All</button>
        <button type="button" data-kind="web" aria-pressed="false">Browser</button>
        <button type="button" data-kind="local" aria-pressed="false">Install</button>
      </div>
      <button type="button" class="toggle" id="starOnly" aria-pressed="false"><span>Starred only</span><span class="n" id="starCount">0</span></button>
      <nav aria-label="Categories"><div class="cats" id="cats"></div></nav>
      <button type="button" class="pick-btn" id="pick">Pick one for me</button>
      <p class="note">Stars are saved in this browser only.</p>
    </aside>

    <main>
      <p class="summary" id="summary" aria-live="polite"></p>
      <div class="results" id="results"></div>
    </main>
  </div>
</div>

    ["practice", "pwnable.tw", "web", "https://pwnable.tw/", "Harder pwn challenges with a scoreboard."],
    ["practice", "ROP Emporium", "web", "https://ropemporium.com/", "Focused practice on return-oriented programming."],
    ["practice", "CTFlearn", "web", "https://ctflearn.com/", "Community-written beginner challenges."]
  ];

  function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  var catName = {};
  CATS.forEach(function (c) { catName[c.id] = c.name; });
  var TOOLS = RAW.map(function (r) { return { cat: r[0], name: r[1], kind: r[2], url: r[3], desc: r[4], id: slug(r[1]) }; });

  var STORE_KEY = "ctf-toolbelt-stars";
  var stars = new Set();
  try { JSON.parse(localStorage.getItem(STORE_KEY) || "[]").forEach(function (id) { stars.add(id); }); } catch (e) {}
  function saveStars() { try { localStorage.setItem(STORE_KEY, JSON.stringify(Array.from(stars))); } catch (e) {} }

  var state = { q: "", cat: "all", kind: "all", starOnly: false };

  var $q = document.getElementById("q");
  var $cats = document.getElementById("cats");
  var $results = document.getElementById("results");
  var $summary = document.getElementById("summary");
  var $starCount = document.getElementById("starCount");
  var $starOnly = document.getElementById("starOnly");

  var webCount = TOOLS.filter(function (t) { return t.kind === "web"; }).length;
  document.getElementById("stats").innerHTML =
    "<span><b>" + TOOLS.length + "</b> tools</span>" +
    "<span><b>" + webCount + "</b> in the browser</span>" +
    "<span><b>" + (TOOLS.length - webCount) + "</b> to install</span>" +
    "<span><b>" + CATS.length + "</b> categories</span>";

  function matches(t) {
    if (state.kind !== "all" && t.kind !== state.kind) return false;
    if (state.starOnly && !stars.has(t.id)) return false;
    var terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
    if (!terms.length) return true;
    var hay = (t.name + " " + t.desc + " " + catName[t.cat] + " " + (t.kind === "web" ? "browser online" : "local install")).toLowerCase();
    return terms.every(function (w) { return hay.indexOf(w) !== -1; });
  }

  var STAR_SVG = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.8L12 3.5z"/></svg>';

  function cardHTML(t) {
    var on = stars.has(t.id);
    return '<article class="card" id="t-' + t.id + '">' +
      '<div class="row"><a class="name" href="' + esc(t.url) + '" target="_blank" rel="noopener noreferrer">' + esc(t.name) + '</a>' +
      '<button type="button" class="star" data-id="' + t.id + '" aria-pressed="' + on + '" aria-label="' + (on ? "Unstar " : "Star ") + esc(t.name) + '">' + STAR_SVG + '</button></div>' +
      '<p class="desc">' + esc(t.desc) + '</p>' +
      '<span class="badge ' + t.kind + '">' + (t.kind === "web" ? "Browser" : "Install") + '</span></article>';
  }

  function render() {
    var base = TOOLS.filter(matches);
    var counts = {};
    base.forEach(function (t) { counts[t.cat] = (counts[t.cat] || 0) + 1; });

    var catHTML = '<button type="button" class="cat" data-cat="all" aria-pressed="' + (state.cat === "all") + '">All<span class="n">' + base.length + '</span></button>';
    CATS.forEach(function (c) {
      catHTML += '<button type="button" class="cat" data-cat="' + c.id + '" aria-pressed="' + (state.cat === c.id) + '">' + esc(c.name) + '<span class="n">' + (counts[c.id] || 0) + '</span></button>';
    });
    $cats.innerHTML = catHTML;

    var shown = state.cat === "all" ? base : base.filter(function (t) { return t.cat === state.cat; });
    var html = "";
    CATS.forEach(function (c) {
      var items = shown.filter(function (t) { return t.cat === c.id; });
      if (!items.length) return;
      html += '<section aria-labelledby="h-' + c.id + '"><div class="sec-head"><h2 id="h-' + c.id + '">' + esc(c.name) + '</h2><span class="count">' + items.length + (items.length === 1 ? " tool" : " tools") + '</span><p>' + esc(c.blurb) + '</p></div><div class="grid">' + items.map(cardHTML).join("") + '</div></section>';
    });
    if (!shown.length) {
      html = '<div class="empty"><p>No tools match these filters.</p><button type="button" id="reset">Reset filters</button></div>';
    }
    $results.innerHTML = html;
    $summary.textContent = "Showing " + shown.length + " of " + TOOLS.length + " tools";
    $starCount.textContent = stars.size;
    $starOnly.setAttribute("aria-pressed", state.starOnly);
    document.querySelectorAll(".seg button").forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-kind") === state.kind); });
  }

  $q.addEventListener("input", function () { state.q = $q.value; render(); });
  $q.addEventListener("keydown", function (e) { if (e.key === "Escape") { $q.value = ""; state.q = ""; render(); } });
  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && document.activeElement !== $q && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) {
      e.preventDefault(); $q.focus(); $q.select();
    }
  });

  document.querySelector(".seg").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-kind]");
    if (!b) return;
    state.kind = b.getAttribute("data-kind");
    render();
  });
  $starOnly.addEventListener("click", function () { state.starOnly = !state.starOnly; render(); });
  $cats.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-cat]");
    if (!b) return;
    state.cat = b.getAttribute("data-cat");
    render();
  });

  $results.addEventListener("click", function (e) {
    var reset = e.target.closest("#reset");
    if (reset) {
      state = { q: "", cat: "all", kind: "all", starOnly: false };
      $q.value = "";
      render();
      return;
    }
    var s = e.target.closest("button.star");
    if (!s) return;
    var id = s.getAttribute("data-id");
    if (stars.has(id)) stars.delete(id); else stars.add(id);
    saveStars();
    if (state.starOnly) { render(); return; }
    var on = stars.has(id);
    var tool = TOOLS.filter(function (t) { return t.id === id; })[0];
    s.setAttribute("aria-pressed", on);
    s.setAttribute("aria-label", (on ? "Unstar " : "Star ") + tool.name);
    $starCount.textContent = stars.size;
  });

  document.getElementById("pick").addEventListener("click", function () {
    var pool = Array.prototype.slice.call($results.querySelectorAll(".card"));
    if (!pool.length) return;
    var prev = $results.querySelector(".picked");
    if (prev) prev.classList.remove("picked");
    var el = pool[Math.floor(Math.random() * pool.length)];
    el.classList.add("picked");
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    el.scrollIntoView({ block: "center", behavior: reduce ? "auto" : "smooth" });
    setTimeout(function () { el.classList.remove("picked"); }, 3000);
  });

  render();
})();
</script>

</body></html>
